# 2026-10-04 atrium: mpv on the LG OLED TV
# 2026-10-06: max quality for Radeon 680M - high-quality profile, hardware decoding (user)
profile=high-quality
hwdec=auto-safe
save-position-on-quit=yes
alang=rus,ru,eng,en
# subtitles: Russian preferred, hidden by default (v - show/hide, j - next track)
slang=rus,ru
sub-visibility=no
# 2026-10-13: off - mpv presented a frame on every 120 Hz vsync, GNOME in HDR missed vsyncs (drops); 24p on 120 Hz is 5:5 anyway
#video-sync=display-resample
# 2026-10-13: off - at 120 Hz 24p is shown 5:5 without it; it made the GPU redraw every 4K refresh (drops)
#interpolation=yes
#tscale=oversample
# 2026-10-13: control socket - read playback stats (drops, render passes) over SSH; only view/root (dir 700)
input-ipc-server=/run/user/1000/mpv.sock
# 2026-10-13: lighter 1080p->4K scaler - ewa_lanczossharp pass took 7.5 of 8.8 ms per frame, budget at 120 Hz is 8.3 ms (drops)
#scale=lanczos
