# GDM configuration storage

[daemon]
# 2026-10-06: TV PC - log in as view automatically, no password
AutomaticLoginEnable=True
AutomaticLogin=view
# 2026-10-06: log view in again 5 s after the session ends (GNOME crash) - RDP comes back by itself
TimedLoginEnable=True
TimedLogin=view
TimedLoginDelay=5

[security]

[debug]
# Uncomment the line below to turn on debugging
#Enable=true
