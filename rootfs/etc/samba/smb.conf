# See smb.conf.example for a more detailed config file or
# read the smb.conf manpage.
# Run 'testparm' to verify the config is correct after
# you modified it.
#
# Note:
# SMB1 is disabled by default. This means clients without support for SMB2 or
# SMB3 are no longer able to connect to smbd (by default).
# 2026-10-03: original config - smb.conf.bak-20261003

[global]
    # 2026-10-03: workgroup of the home Windows PCs (WORKGROUP is the Windows default)
    workgroup = WORKGROUP
    security = user

    passdb backend = tdbsam

    # 2026-10-03: share without login (user decision) - unknown users become guest
    map to guest = Bad User

    # 2026-10-03: no printers on atrium
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # 2026-10-03: home network only
    hosts allow = 192.168.0.0/24 127.0.0.1
    hosts deny = ALL

    # 2026-11-10: macOS (Finder) keeps its metadata in xattr streams instead of ._* files;
    # streams_xattr also keeps Windows streams (Zone.Identifier). catia - Mac file name characters.
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:veto_appledouble = yes
    fruit:delete_empty_adfiles = yes
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:posix_rename = yes
    # 2026-11-10: no .DS_Store from any Mac (not only ours); a folder with one can still be deleted
    veto files = /.DS_Store/
    delete veto files = yes

    # Install samba-usershares package for support
    include = /etc/samba/usershares.conf

# 2026-10-03: [homes], [printers], [print$] removed - atrium shares only /srv.
# 2026-10-03: one share for the PC, no login. The root (/srv, root:root 755) is read-only, so the
# 4 folders cannot be deleted or renamed; inside them (view:view 2775) - read and write as view.
[media]
    comment = atrium
    path = /srv
    read only = no
    guest ok = yes
    guest only = yes
    force user = view
    force group = view
    create mask = 0664
    directory mask = 2775
    hide unreadable = yes
    # 2026-10-03: rwx is not "Full Control" - Windows gets "access denied" when deleting the 4 root folders
    acl map full control = no
