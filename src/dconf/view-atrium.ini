# atrium: GNOME settings of the TV user "view" (only what differs from the GNOME defaults).
# Load as view inside the running session (install step 9):
#   dconf load / < view-atrium.ini
# 2026-10-13: refreshed from `dconf dump /` of view on atrium (Fedora 44, GNOME 50.5); window sizes,
# recent folders and other runtime state left out.
# Not here, set elsewhere: dock icons (system lock /etc/dconf/db/local.d/00-atrium-dock), dark theme
# (system lock 00-atrium-dark), RDP (grdctl), display mode (monitors.xml).
#
# Why the less obvious keys:
# - idle-delay 0: GNOME's own screen blank raises the screen shield, and under the shield GNOME refuses
#   screen sharing (RDP: "Session creation inhibited"). The screen is turned off by atrium-screensaver
#   after 30 min instead.
# - show-banners false: no notifications on the TV at all (updates only from the console).
# - allow-extension-installation false: GNOME stops checking extensions.gnome.org for updates. NB: GNOME 50
#   then does not load ~/.local/share/gnome-shell/extensions - all extensions live in
#   /usr/local/share/gnome-shell/extensions.
# - xkb-options: Alt+Shift toggles us/ru, Caps Lock = us, Shift+Caps = ru (the Unified Remote typing
#   code selects the layout per character), right Alt = AltGr.
# - Executor: right side CPU/GPU/VCN load, left side network speed (files written by atrium-sysload);
#   click-on-output-active false - a click on the text does not open settings.
# - Freon: one temperature - the CPU (k10temp Tctl).
# - Desktop Widgets (azclock): df/du text top right every 10 min; create-initial-widget false - no clock
#   widget on first start; update-notifier-enabled false - no "new version / donate" popup.
# - Just Perfection: no Activities button, no Night Light / Dark Style / Do Not Disturb in quick settings,
#   desktop (not the overview) at login.
# - Dash to Dock: bottom, overview at login off.

[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file:///usr/local/share/backgrounds/atrium/atrium-painting-evening-v2-4k.png'
picture-uri-dark='file:///usr/local/share/backgrounds/atrium/atrium-painting-evening-v2-4k.png'

[org/gnome/desktop/datetime]
automatic-timezone=false

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ru')]
xkb-options=['grp:alt_shift_toggle', 'grp:shift_caps_switch', 'lv3:ralt_switch']

[org/gnome/desktop/interface]
clock-format='24h'
color-scheme='prefer-dark'
document-font-name='Geist 12'
enable-hot-corners=false
font-hinting='none'
font-name='Geist 11'
gtk-theme='adw-gtk3-dark'
monospace-font-name='Geist Mono 11'

[org/gnome/desktop/lockdown]
disable-lock-screen=true

[org/gnome/desktop/notifications]
show-banners=false

[org/gnome/desktop/screensaver]
lock-enabled=false

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/sound]
event-sounds=false

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=1

[org/gnome/mutter]
dynamic-workspaces=false

[org/gnome/nautilus/list-view]
default-zoom-level='small'

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false

[org/gnome/settings-daemon/plugins/housekeeping]
donation-reminder-enabled=false

[org/gnome/settings-daemon/plugins/power]
power-button-action='interactive'
sleep-inactive-ac-type='nothing'

[org/gnome/shell]
allow-extension-installation=false
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'freon@UshakovVasilii_Github.yahoo.com', 'just-perfection-desktop@just-perfection', 'executor@raujonas.github.io', 'azclock@azclock.gitlab.com', 'atrium-no-dnd-icon@atrium.example.com', 'gjsosk@vishram1123.com', 'atrium-lock@atrium.example.com', 'atrium-brightness-value@atrium.example.com']
welcome-dialog-last-shown-version='50.5'

[org/gnome/shell/extensions/azclock]
create-initial-widget=false
update-notifier-enabled=false
widgets=[{'atrium-disks': <{'enabled': <true>}>}]

[org/gnome/shell/extensions/azclock/widget-data/atrium-disks]
anchor-point='Top_Right'
convert-old-location-done=true
elements=[{'df-du': <{'enabled': <true>}>}]
location-data='{"monitorIndex": 0, "relativeX": 0.96875, "relativeY": 0.0787}'
lock-widget=true
name='atrium disks'
padding=(0, 0, 0, 0)

[org/gnome/shell/extensions/azclock/widget-data/atrium-disks/element-data/df-du]
command='df -h --output=target,size,used,avail,pcent / /srv; echo; du -sh /srv/* 2>/dev/null | sort -rh'
element-type='Command_Label'
font-family-override=(true, 'Geist Mono')
font-size=12
foreground-color='rgba(255, 255, 255, 0.92)'
line-alignment='Start'
name='df du'
polling-interval=600000

[org/gnome/shell/extensions/dash-to-dock]
background-opacity=0.80000000000000004
dash-max-icon-size=48
disable-overview-on-startup=true
dock-position='BOTTOM'
height-fraction=0.90000000000000002

[org/gnome/shell/extensions/executor]
center-active=false
click-on-output-active=false
left-active=true
left-commands-json='{"commands":[{"isActive":true,"command":"cat /run/atrium-sysload/net","interval":1,"uuid":"atrium-net"}]}'
left-index=0
location=0
right-commands-json='{"commands":[{"isActive":true,"command":"cat /run/atrium-sysload/panel","interval":1,"uuid":"atrium-sysload"}]}'
right-index=0

[org/gnome/shell/extensions/freon]
hot-sensors=['Tctl']

[org/gnome/shell/extensions/gjsosk]
background-a=1.0
background-a-dark=1.0
background-b=250.0
background-b-dark=50.0
background-g=250.0
background-g-dark=50.0
background-r=250.0
background-r-dark=50.0
border-spacing-px=2
default-snap=7
disable-edge-swipe=false
enable-drag=true
enable-key-repeat=false
enable-tap-gesture=1
font-bold=false
font-size-px=14
indicator-enabled=true
key-repeat-rate=100
landscape-height-percent=30
landscape-width-percent=70
layout-landscape=5
layout-portrait=5
outer-spacing-px=20
play-sound=true
portrait-height-percent=30
portrait-width-percent=100
round-key-corners=false
show-icons=true
snap-spacing-px=25
system-accent-col=false

[org/gnome/shell/extensions/just-perfection]
activities-button=false
quick-settings-dark-mode=false
quick-settings-do-not-disturb=false
quick-settings-night-light=false
startup-status=0
support-notifier-type=0

[org/gnome/tweaks]
show-extensions-notice=false
